      <!-- Camera Island -->
      <rect x="85" y="16" width="80" height="15" rx="7.5" fill="#1e293b"/>
      <circle cx="145" cy="23.5" r="3.5" fill="#0f172a"/>

      <!-- Header Badge -->
      <rect x="20" y="42" width="210" height="26" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="0.8"/>
