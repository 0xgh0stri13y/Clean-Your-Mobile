      <text x="44" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">BEFORE · 84 BLOAT APPS</text>

      <!-- Bloat Notification 1: Lockscreen ads -->
      <g transform="translate(20, 80)">
