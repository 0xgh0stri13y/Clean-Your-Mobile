        <text x="126" y="27" font-size="20" text-anchor="middle">📷</text>
        <text x="126" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Camera</text>

        <!-- App 4: Settings -->
        <rect x="156" y="0" width="44" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="178" y="27" font-size="20" text-anchor="middle">⚙️</text>
        <text x="178" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Settings</text>
      </g>

      <!-- Clean Minimal Apps Row 2 -->
      <g transform="translate(28, 270)">
        <!-- App 5: Browser -->
        <rect x="0" y="0" width="44" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="22" y="27" font-size="20" text-anchor="middle">🌐</text>
        <text x="22" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Browser</text>

        <!-- App 6: Photos -->
