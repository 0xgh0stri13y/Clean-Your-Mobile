        <text x="126" y="27" font-size="20" text-anchor="middle">▶️</text>
        <text x="126" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Store</text>

