<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow-green" cx="75%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-blue" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-border-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="green-text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="520" rx="16" fill="#0b0f19"/>
  <rect width="1200" height="520" rx="16" fill="url(#bg-glow-green)"/>
  <rect width="1200" height="520" rx="16" fill="url(#bg-glow-blue)"/>
  <rect width="1198" height="518" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Left Column: Typography & Badges -->
  <g transform="translate(64, 55)">
    <!-- Version Pill -->
    <rect width="230" height="30" rx="15" fill="#13231e" stroke="#059669" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="4.5" fill="#34d399"/>
    <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" letter-spacing="1">CLEAN YOUR MOBILE · V1.0</text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="url(#text-gradient)" letter-spacing="-1">Your phone,</text>
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="url(#green-text-gradient)" letter-spacing="-1">minus the bloat.</text>

    <!-- Description -->
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8" font-weight="400">
      <tspan x="0" dy="0">Autonomous debloating for Android via ADB.</tspan>
      <tspan x="0" dy="25">Stripping ad daemons, telemetry, and preinstalled junk.</tspan>
    </text>

    <!-- 4 Pill Feature Badges -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <rect width="186" height="36" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">🛡️ 142 Never-Touch Guards</text>

      <!-- Pill 2 -->
      <rect x="198" width="170" height="36" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="212" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">⚡ Batched ADB Engine</text>

      <!-- Pill 3 -->
      <rect y="48" width="186" height="36" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="14" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">↩️ One-Line Full Restore</text>

      <!-- Pill 4 -->
      <rect x="198" y="48" width="170" height="36" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="212" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">🔒 Zero Root Required</text>
    </g>

    <!-- Supported Brands Footer -->
    <g transform="translate(0, 390)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="500" letter-spacing="0.5">
