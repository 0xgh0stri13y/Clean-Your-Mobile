        <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f87171">Glance / Lockscreen Ads</text>
        <text x="42" y="38" font-family="monospace" font-size="9" fill="#94a3b8">com.glance.internet</text>
        <text x="172" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#64748b">now</text>
      </g>

      <!-- Bloat Notification 2: System Ad Solution -->
      <g transform="translate(20, 146)">
        <rect width="210" height="56" rx="8" fill="#171e2e" stroke="#334155" stroke-width="0.8"/>
        <rect x="10" y="12" width="24" height="24" rx="5" fill="#f97316" fill-opacity="0.2"/>
