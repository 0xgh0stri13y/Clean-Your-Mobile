        <text x="105" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="300" fill="#f8fafc" text-anchor="middle">09:41</text>
        <text x="105" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">BATTERY OPTIMIZED · 0 TRACKERS</text>
