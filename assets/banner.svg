        <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fb923c">MSA System Ad Daemon</text>
        <text x="42" y="38" font-family="monospace" font-size="9" fill="#94a3b8">com.miui.msa.global</text>
