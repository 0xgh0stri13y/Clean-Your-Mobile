        <rect width="210" height="56" rx="8" fill="#171e2e" stroke="#334155" stroke-width="0.8"/>
        <rect x="10" y="12" width="24" height="24" rx="5" fill="#a855f7" fill-opacity="0.2"/>
        <text x="17" y="28" font-size="12">📦</text>
        <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#c084fc">Partner Preloads / Stubs</text>
