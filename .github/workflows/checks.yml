name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-and-shell:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Database
        run: python tools/validate_db.py

      - name: Guard pattern in all four copies
        run: python tools/sync_guard.py

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: Python syntax
        run: python -c "import ast,glob;[ast.parse(open(f,encoding='utf-8').read(),f) for f in glob.glob('tools/*.py')]"

      - name: PowerShell files are ASCII only
        run: |
          if LC_ALL=C grep -nP '[^\x00-\x7F]' scripts/*.ps1; then
            echo "Non-ASCII characters break Windows PowerShell 5.1"; exit 1
          fi

      - name: Tools run without a phone
        run: |
          python -c "import json;print('\n'.join(p['id'] for p in json.load(open('database/debloat_db.json',encoding='utf-8'))['packages']))" > "$RUNNER_TEMP/packages.txt"
          python tools/scan.py --from-list "$RUNNER_TEMP/packages.txt" --level expert
          python tools/explain.py com.google.ar.core
          for f in presets/*.json; do python tools/preset.py show "$(basename "$f" .json)"; done

  powershell-5:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse every script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = 0
          foreach ($f in Get-ChildItem scripts\*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count) {
              $failed++
              $errors | ForEach-Object { "{0}:{1} {2}" -f $f.Name, $_.Extent.StartLineNumber, $_.Message }
            } else { "$($f.Name) ok" }
          }
          if ($failed) { exit 1 }
